<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slideshow Maker — Fast</title>

  <!-- Tiny inline favicon to avoid 404s -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Cpath d='M18 44h28v-4H22c-4 0-6-2-6-6 0-4 3-6 7-6h23v-4H23c-7 0-11 4-11 10s4 10 10 10z' fill='%23fff'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="./css/app.css">
  <style>
    /* Make the preview appear smaller while keeping the canvas at full export res */
    .canvasFrame { width: 420px; height: 420px; }
    .canvasFrame canvas { width: 100%; height: 100%; display: block; }
    /* Optional: nicer toast */
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:10px;opacity:.0;transition:opacity .2s ease,transform .2s ease;z-index:9999}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  </style>

  <!-- Tell exporter where your local FFmpeg files live on Netlify -->
  <script>
    window.__FFMPEG_BASE = '/public/vendor/ffmpeg/';
  </script>
</head>
<body>
  <header class="app-header">
    <div class="title">
      <h1>Slideshow Maker — Fast</h1>
      <span class="badge">Lean build</span>
    </div>
  </header>

  <div class="wrap">
    <aside class="panel controls" id="controls">
      <section class="block">
        <div class="hd"><b>Photos</b></div>
        <div class="bd">
          <div id="drop" class="uploader" tabindex="0">
            <div class="big">Drag & drop images</div>
            <div>or</div>
            <div style="margin-top:10px">
              <button class="btn" id="pickBtn">Choose images</button>
              <input id="fileInput" type="file" accept="image/*" multiple hidden>
            </div>
            <div class="help" style="margin-top:10px">Auto-rotates, skips duplicates, drag to reorder.</div>
          </div>
          <div class="thumbs" id="thumbs"></div>
        </div>
      </section>

      <section class="block">
        <div class="hd"><b>Output</b></div>
        <div class="bd grid-2">
          <label>Aspect ratio
            <select id="resPreset" class="select">
              <option value="sq" selected>Square 1080×1080</option>
              <option value="169">16:9 1920×1080</option>
              <option value="916">9:16 1080×1920</option>
              <option value="54L">5:4 1350×1080</option>
              <option value="45P">4:5 1080×1350</option>
            </select>
          </label>
          <label>FPS
            <select id="fps" class="select">
              <option value="24">24</option>
              <option value="30" selected>30</option>
              <option value="60">60</option>
            </select>
          </label>
          <label>Slide duration (s)
            <input id="holdSec" type="range" min="0.5" max="8" step="0.1" value="2.5">
            <span class="val" id="valHold">2.5s</span>
          </label>
          <label>Crossfade (s)
            <input id="transitionSec" type="range" min="0" max="2.5" step="0.05" value="0.6">
            <span class="val" id="valTrans">0.6s</span>
          </label>
          <label>Motion amount
            <input id="motionAmt" type="range" min="0" max="0.3" step="0.01" value="0.12">
            <span class="val" id="valMotionAmt">0.12×</span>
          </label>
          <label>Bitrate (Mbps)
            <input id="bitrate" type="range" min="2" max="20" step="0.5" value="8">
            <span class="val" id="valBitrate">8.0 Mbps</span>
          </label>
          <label>Loop preview
            <select id="loopPrev" class="select">
              <option value="1" selected>Yes</option>
              <option value="0">No</option>
            </select>
          </label>
        </div>
        <div class="seek">
          <span class="time" id="currTime">00:00</span>
          <input id="seek" type="range" min="0" max="0" value="0" step="0.01">
          <span class="time" id="totalTime">00:00</span>
        </div>
      </section>

      <section class="block">
        <div class="hd"><b>Preview</b></div>
        <div class="bd bar">
          <button id="playBtn" class="btn primary">▶ Play</button>
          <button id="pauseBtn" class="btn ghost">⏸ Pause</button>
          <button id="stopBtn" class="btn ghost">⏹ Stop</button>
          <button id="adjustBtn" class="btn">🖐️ Adjust position</button>
        </div>
      </section>

      <section class="block">
        <div class="hd"><b>Export</b></div>
        <div class="bd">
          <div class="progress"><span id="progBar"></span></div>
          <div class="bar" style="flex-wrap:wrap;gap:10px 16px">
            <button id="exportBtn" class="btn">Export (WebM)</button>
            <label class="bar" style="gap:8px">
              <input id="autoMp4" type="checkbox">
              <span>Auto-convert to MP4 (slower)</span>
            </label>
            <button id="convertBtn" class="btn ghost" disabled>Convert last WebM → MP4</button>
          </div>
          <div id="dlArea" class="help" style="margin-top:8px"></div>
        </div>
      </section>
    </aside>

    <main class="panel preview">
      <div class="hd">
        <b>Live Preview</b>
        <span class="help">Drag to reposition when “Adjust position” is enabled</span>
      </div>
      <div class="bd canvasWrap">
        <div class="canvasFrame">
          <!-- Keep export resolution high; CSS scales it smaller for preview -->
          <canvas id="stage" width="1080" height="1080"></canvas>
        </div>
      </div>
    </main>
  </div>

  <!-- App entry -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
